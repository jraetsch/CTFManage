[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctftool"
version = "0.1.0"
description = "Fetch, organise and track CTF challenges"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ctf = "ctf.cli:main"

[tool.setuptools.packages.find]
include = ["ctf*"]
